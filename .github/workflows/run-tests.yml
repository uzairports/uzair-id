name: run-tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -uroot -ppassword" --health-interval=10s --health-timeout=5s --health-retries=3
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: true
      matrix:
        php: [8.4]
        laravel: [13.*]
        stability: [prefer-lowest, prefer-stable]
        database: [sqlite, mysql, pgsql]
        exclude:
          - stability: prefer-lowest
            database: mysql
          - stability: prefer-lowest
            database: pgsql

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.database }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, bcmath, soap, intl, gd, exif, iconv
          # pcov rather than xdebug: it only measures which lines ran, which is
          # all the report needs, and costs a fraction of the run time.
          coverage: pcov

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      # The download is the same on every run that does not change a
      # constraint, and there are two jobs paying for it. The key carries the
      # stability, because the two resolve to different sets and would
      # otherwise keep evicting each other.
      - name: Locate the composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: php-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            php-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.stability }}-
            php-${{ matrix.php }}-${{ matrix.laravel }}-

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Analyse
        run: composer analyse

      # The suite is measured once, not once per stability: the report is about
      # the tests, and they are the same in both jobs. The other job runs them
      # without the coverage driver attached.
      #
      # Not `--parallel`: the suite runs in about three seconds, and paratest
      # spends longer starting its workers than it saves. Worth revisiting if
      # the suite grows to where the run is dominated by the tests themselves.
      - name: Execute tests
        if: matrix.stability != 'prefer-stable' || matrix.database != 'sqlite'
        run: vendor/bin/pest
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.database == 'mysql' && 3306 || 5432 }}
          DB_DATABASE: test
          DB_USERNAME: ${{ matrix.database == 'mysql' && 'root' || 'postgres' }}
          # Both servers are started with the same password rather than giving
          # MySQL an empty one: `a && '' || b` cannot express an empty string in
          # a workflow expression, because `''` is falsy and the whole thing
          # falls through to `b`. The mysql job then sent `password` to a root
          # account that had none, and every test died on `Access denied for
          # user 'root'`.
          DB_PASSWORD: password

      - name: Execute tests with coverage
        if: matrix.stability == 'prefer-stable' && matrix.database == 'sqlite'
        run: vendor/bin/pest --coverage
        env:
          DB_CONNECTION: ${{ matrix.database }}
